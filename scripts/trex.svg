<svg xmlns="http://www.w3.org/2000/svg" width="820" height="130" viewBox="0 0 820 130">
  <rect width="820" height="130" fill="#000000"/>

  <line x1="0" y1="100" x2="820" y2="100" stroke="#3a3a3a" stroke-width="2"/>

  <!-- cactus 1 -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="860 0; -80 0" dur="6s" repeatCount="indefinite"/>
    <rect x="0" y="72" width="16" height="28" fill="#2ecc40"/>
    <rect x="-9" y="58" width="8" height="18" fill="#2ecc40"/>
    <rect x="17" y="62" width="8" height="16" fill="#2ecc40"/>
  </g>

  <!-- cactus 2 -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="1180 0; -80 0" dur="6s" begin="3s" repeatCount="indefinite"/>
    <rect x="0" y="74" width="18" height="26" fill="#2ecc40"/>
    <rect x="-11" y="62" width="9" height="16" fill="#2ecc40"/>
  </g>

  <!-- dino -->
  <g transform="translate(60 0)">
    <animateTransform attributeName="transform" type="translate"
      values="60 0; 60 -55; 60 0; 60 0"
      keyTimes="0; 0.18; 0.30; 1" dur="6s" repeatCount="indefinite"/>

    <path d="M 60 82 L 90 82 L 90 94 L 70 94 Z M 90 74 L 112 74 L 112 82 L 90 82 Z" fill="#2ecc40"/>
    <rect x="110" y="62" width="24" height="14" fill="#2ecc40"/>
    <rect x="128" y="64" width="10" height="8" fill="#2ecc40"/>
    <rect x="118" y="66" width="3" height="3" fill="#000000"/>
    <polygon points="60,82 46,74 60,74" fill="#2ecc40"/>
    <rect x="98" y="82" width="8" height="4" fill="#2ecc40"/>

    <rect x="70" y="94" width="6" height="10" fill="#2ecc40">
      <animate attributeName="y" values="94;88;94" dur="0.18s" repeatCount="indefinite"/>
    </rect>
    <rect x="82" y="94" width="6" height="10" fill="#2ecc40">
      <animate attributeName="y" values="88;94;88" dur="0.18s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
